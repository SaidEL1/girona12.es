# GERONA 12 — LEGACY QR HOST RECOVERY (SEPARATE NETLIFY SITE)
#
# Deploy this folder as its OWN Netlify site (drag-and-drop or manual upload).
# Then rename THAT site to slug `girona12` so it owns:
#   https://girona12.netlify.app
#
# Do NOT merge these redirects into the main app site (`gerona12`).
# Do NOT use this package to change SEO crawl origins.
#
# After deploy + rename, expected behavior:
#   https://girona12.netlify.app/es/menu-original
#     → 301 → https://gerona12.netlify.app/es/menu-original

[build]
  publish = "."
  # No build command — static redirect site only.

[[redirects]]
  from = "/*"
  to = "https://gerona12.netlify.app/:splat"
  status = 301
  force = true
