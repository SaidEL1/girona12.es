# GERONA 12 — Netlify + Next.js (App Router) / OpenNext
#
# Brand: GERONA 12
# Permanent custom domain (future): https://gerona12.es
# Intended Netlify hostname (after dashboard site rename): https://gerona12.es.netlify.app
# Verified live Netlify hostname (current): https://girona12.netlify.app
# Crawl-facing SEO stays on the verified live host until rename/cutover flags flip —
# see docs/deploy/domain-migration-gerona12.md.
#
# Required settings (also mirrored in Netlify UI for current site slug `girona12`):
# - Build command: npm run build
# - Publish directory: EMPTY (do not set to public, ., out, or dist)
# - Production branch: main
#
# The OpenNext adapter (@netlify/plugin-nextjs) must run so SSR functions
# and edge middleware (src/proxy.ts) are deployed. Declared explicitly
# below because UI-only / empty-cmd deploys previously published a static
# file mirror without the adapter.
#
# Do NOT add SPA catch-all redirects (/* -> /index.html).
# Do NOT enable netlify.app → gerona12.es redirects until the custom domain is live.
# Do NOT change this build adapter / pipeline as part of brand/domain identity work.

[build]
  command = "npm run build"
  # Required by @netlify/plugin-nextjs (cannot equal site base directory).
  # OpenNext consumes .next and emits functions/edge — do not treat as static export.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
